<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dijital Ürün Pasaportu – Prototip</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@200;400;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{
    --bg:#070d1f; --bg2:#0b1430; --card:rgba(255,255,255,.035); --line:rgba(255,255,255,.09);
    --ink:#ffffff; --muted:#9ba5c0; --soft:#c9d0e2; --accent:#ffffff;
    --r:18px;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth;background:var(--bg)}
  body{margin:0;color:var(--ink);font-family:"Plus Jakarta Sans","Helvetica Neue",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
    background:
      radial-gradient(900px 500px at 50% -120px, rgba(88,120,255,.22), transparent 70%),
      radial-gradient(600px 400px at 100% 40%, rgba(60,90,200,.08), transparent 70%),
      var(--bg);
    min-height:100vh}
  .wrap{max-width:600px;margin:0 auto;padding:0 18px 48px}
  header.top{padding:22px 0 0;display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);letter-spacing:.02em}
  header.top .brandmark{font-weight:700;color:var(--soft);letter-spacing:.14em;text-transform:uppercase;font-size:11px}

  .hero{text-align:center;padding:44px 0 28px}
  .pill{display:inline-flex;align-items:center;gap:10px;background:rgba(255,255,255,.06);border:1px solid var(--line);color:var(--soft);
    font-size:12px;font-weight:400;padding:7px 14px;border-radius:8px;letter-spacing:.01em}
  .pill .sep{width:1px;height:12px;background:var(--line)}
  .hero .art{width:84px;height:84px;margin:28px auto 6px;display:grid;place-items:center;border-radius:22px;
    background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,.02));border:1px solid var(--line)}
  .hero .art svg{width:58px;height:58px}
  .hero h1{font-size:clamp(34px,9vw,52px);line-height:1.04;letter-spacing:-.045em;margin:18px 0 0;font-weight:200}
  .hero h1 b{display:block;font-weight:700}
  .hero .lead{color:var(--muted);max-width:460px;margin:18px auto 0;font-size:15.5px}
  .hero .group{margin-top:10px;font-size:12.5px;color:var(--soft);letter-spacing:.04em}
  .ctas{display:flex;gap:10px;justify-content:center;margin-top:26px;flex-wrap:wrap}
  .btn{font:400 14px "Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif;padding:11px 18px;border-radius:9px;cursor:pointer;display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:rgba(255,255,255,.03);color:#fff}
  .btn.primary{background:#fff;color:#0a1128;border-color:#fff}

  .facts{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:8px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
  .fact{background:var(--bg2);padding:16px 18px}
  .fact .k{font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.12em;text-transform:uppercase}
  .fact .v{font-weight:700;margin-top:4px;display:flex;align-items:center;gap:8px;font-size:15.5px;letter-spacing:-.01em}
  .swatch{width:14px;height:14px;border-radius:50%;border:1px solid rgba(255,255,255,.35);flex:none}

  nav.tabs{position:sticky;top:0;z-index:5;margin:18px -18px 0;padding:12px 18px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;
    background:rgba(7,13,31,.82);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
  nav.tabs::-webkit-scrollbar{display:none}
  nav.tabs button{flex:none;border:1px solid transparent;background:transparent;color:var(--muted);font:400 13px "Plus Jakarta Sans","Helvetica Neue",Arial,sans-serif;padding:7px 13px;border-radius:8px;cursor:pointer}
  nav.tabs button.on{background:rgba(255,255,255,.08);color:#fff;border-color:var(--line)}

  section{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;margin-top:14px;scroll-margin-top:70px}
  section h2{font-size:19px;margin:0 0 16px;display:flex;align-items:baseline;gap:12px;font-weight:700;letter-spacing:-.02em}
  section h2 .n{font-size:11px;color:var(--muted);font-weight:400;letter-spacing:.14em;font-variant-numeric:tabular-nums}
  p{margin:0 0 12px;color:var(--soft)}
  dl.rows{margin:0}
  dl.rows div{display:flex;justify-content:space-between;gap:16px;padding:11px 0;border-top:1px solid var(--line)}
  dl.rows div:first-child{border-top:0}
  dl.rows dt{color:var(--muted);font-size:13.5px}
  dl.rows dd{margin:0;font-weight:400;text-align:right;font-size:13.5px;color:#fff}
  dl.rows.stack div{display:block}
  dl.rows.stack dd{text-align:left;font-weight:400;margin-top:3px;color:var(--soft)}
  .compbar{display:flex;height:8px;border-radius:999px;overflow:hidden;margin:4px 0 16px;gap:2px}
  .legend{display:grid;gap:12px}
  .legend .item{display:flex;align-items:flex-start;gap:12px}
  .legend .dot{width:10px;height:10px;border-radius:3px;margin-top:6px;flex:none}
  .legend .pct{margin-left:auto;font-weight:200;font-size:22px;letter-spacing:-.03em;line-height:1}
  .legend .sub{font-size:12.5px;color:var(--muted)}
  .care{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
  .care .c{border:1px solid var(--line);border-radius:14px;padding:14px 8px 12px;text-align:center;font-size:12px;line-height:1.35;color:var(--soft);background:rgba(255,255,255,.02)}
  .care svg{width:38px;height:38px;display:block;margin:0 auto 8px;color:#fff}
  .tip{border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;margin-top:14px;color:var(--soft)}
  ol.chain{list-style:none;margin:0;padding:0}
  ol.chain li{position:relative;padding:0 0 20px 38px}
  ol.chain li:last-child{padding-bottom:0}
  ol.chain li::before{content:"";position:absolute;left:11px;top:26px;bottom:2px;width:1px;background:var(--line)}
  ol.chain li:last-child::before{display:none}
  ol.chain .pin{position:absolute;left:0;top:0;width:23px;height:23px;border-radius:50%;border:1px solid rgba(255,255,255,.35);color:#fff;font-size:11px;font-weight:700;display:grid;place-items:center;background:var(--bg2)}
  ol.chain .st{font-weight:700}
  ol.chain .wh{font-size:13.5px;color:var(--soft)}
  ol.chain .wh b{color:#fff;font-weight:400}
  ol.chain .who{font-size:12.5px;color:var(--muted)}
  .kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-bottom:18px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .kpi{background:var(--bg2);padding:14px 12px}
  .kpi .big{font-size:26px;font-weight:200;letter-spacing:-.04em;line-height:1.1}
  .kpi .u{font-size:11px;color:var(--muted);font-weight:400;margin-top:4px}
  .bars{display:grid;gap:10px;margin:6px 0 4px}
  .bar{display:grid;grid-template-columns:104px 1fr 48px;gap:10px;align-items:center;font-size:13px;color:var(--soft)}
  .bar .track{height:6px;background:rgba(255,255,255,.07);border-radius:999px;overflow:hidden}
  .bar .fill{height:100%;background:linear-gradient(90deg,#8ea2ff,#ffffff);border-radius:999px}
  .bar .val{text-align:right;font-weight:400;color:#fff;font-variant-numeric:tabular-nums}
  .certs{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
  .cert{border:1px solid rgba(255,255,255,.22);color:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:400}
  h3{font-size:11px;margin:20px 0 10px;font-weight:400;color:var(--muted);letter-spacing:.14em;text-transform:uppercase}
  .note{font-size:12px;color:var(--muted);margin-top:10px}
  footer{margin-top:18px;font-size:12.5px;color:var(--muted);text-align:center}
  footer .qr{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px;text-align:center;margin-bottom:16px}
  footer .qr img,footer .qr canvas{width:160px;height:160px;image-rendering:pixelated}
  footer .qr #qrcode{border-radius:12px}
  footer .qr div:last-child{margin-top:10px}
  footer .other a{color:#fff;font-weight:400;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.3)}
  .demo{border:1px dashed rgba(255,255,255,.18);color:var(--muted);border-radius:12px;padding:10px 12px;font-size:12.5px;margin-top:14px}
  /* ===== Vurgu rengi (şampanya altını) + daha fazla kalın yazı ===== */
  :root{ --gold:#e3c47e; --gold2:#b98f45; --gold-soft:rgba(227,196,126,.12); }
  body{background:
      radial-gradient(900px 500px at 50% -120px, rgba(88,120,255,.22), transparent 70%),
      radial-gradient(500px 360px at 110% 30%, rgba(227,196,126,.07), transparent 70%),
      var(--bg)}
  header.top .brandmark{color:var(--gold);font-weight:700}
  .pill{font-weight:700;color:#fff;border-color:rgba(227,196,126,.35);background:var(--gold-soft)}
  .pill .sep{background:rgba(227,196,126,.45)}
  .hero .art{border-color:rgba(227,196,126,.28);box-shadow:0 0 40px rgba(227,196,126,.08)}
  .hero .group{color:var(--gold);font-weight:700;letter-spacing:.08em;text-transform:uppercase;font-size:11.5px}
  .hero .lead{color:var(--soft)}
  .btn{font-weight:700}
  .btn.primary{background:linear-gradient(180deg,#f0d696,var(--gold));border-color:var(--gold);color:#0a1128}
  .fact .k{font-weight:700;color:var(--gold)}
  nav.tabs button{font-weight:700}
  nav.tabs button.on{background:var(--gold-soft);border-color:rgba(227,196,126,.4);color:var(--gold)}
  section h2{font-weight:700}
  section h2 .n{color:var(--gold);font-weight:700}
  dl.rows dt{font-weight:400}
  dl.rows dd{font-weight:700}
  dl.rows.stack dt{font-weight:700;color:#fff}
  .legend b{font-weight:700}
  .legend .pct{font-weight:700;font-size:20px}
  .care .c{font-weight:700;color:#fff}
  .care svg{color:var(--gold)}
  .tip{border-color:rgba(227,196,126,.25);background:var(--gold-soft)}
  ol.chain .pin{border-color:var(--gold);color:var(--gold);font-weight:700}
  ol.chain li::before{background:linear-gradient(var(--gold2),rgba(255,255,255,.08))}
  ol.chain .wh b{font-weight:700}
  .kpi .big{font-weight:700;color:var(--gold)}
  .kpi .u{font-weight:700}
  .bar span:first-child{font-weight:700}
  .bar .fill{background:linear-gradient(90deg,var(--gold2),var(--gold))}
  .bar .val{font-weight:700}
  .cert{border-color:rgba(227,196,126,.55);color:var(--gold);font-weight:700;background:var(--gold-soft)}
  h3{font-weight:700;color:var(--gold)}
  footer .other a{color:var(--gold);font-weight:700;border-bottom-color:rgba(227,196,126,.4)}
  footer .qr{border-color:rgba(227,196,126,.25)}
  footer .qr div:last-child{font-weight:700;color:#fff}
  /* Sertifikalar yeşil */
  :root{ --green:#5fd39b; }
  .cert{border-color:rgba(95,211,155,.55);color:var(--green);background:rgba(95,211,155,.10)}
  .cert::before{content:"✓";margin-right:6px}
  /* Satır etiketleri (Pasaport no, GTIN, Beden…) daha kalın */
  dl.rows dt{font-weight:700;color:#b3bcd4}
  /* Kaydırınca netleşme efekti */
  .reveal{opacity:0;filter:blur(12px);transform:translateY(26px) scale(.985);
    transition:opacity .9s ease, filter .9s ease, transform .9s cubic-bezier(.16,.8,.24,1);
    transition-delay:var(--d,0ms);will-change:opacity,filter,transform}
  .reveal.in{opacity:1;filter:blur(0);transform:none}
  @media (prefers-reduced-motion: reduce){ .reveal{opacity:1;filter:none;transform:none;transition:none} }
  /* Ürün fotoğrafı */
  .hero .art.photo{width:min(240px,66vw);height:auto;aspect-ratio:1/1;padding:0;overflow:hidden;background:#eeeeee;
    border:1px solid rgba(227,196,126,.35);border-radius:26px;box-shadow:0 24px 60px -20px rgba(0,0,0,.6),0 0 50px rgba(227,196,126,.10);margin-top:30px}
  .hero .art.photo img{width:100%;height:100%;object-fit:cover;display:block}
  /* Marka adı: InsideOut (büyük-küçük harf korunur) */
  header.top .brandmark{text-transform:none;letter-spacing:.03em;font-size:26px;font-weight:200;line-height:1;color:#ffffff}
</style>
</head>

    supply: [
      { stage: "Lif üretimi", what: "Organik pamuk", where: "Aydın, Türkiye", who: "Sertifikalı üretici (örnek)" },
      { stage: "Geri dönüşüm", what: "Kesim atığından lif geri kazanımı", where: "Uşak, Türkiye", who: "Örnek Geri Dönüşüm Ltd." },
      { stage: "İplik eğirme", what: "Ne 30/1 penye karışım iplik", where: "Kahramanmaraş, Türkiye", who: "Örnek İplik A.Ş." },
      { stage: "Örme", what: "Süprem kumaş örme", where: "Bursa, Türkiye", who: "Örnek Örme San." },
      { stage: "Boya & apre", what: "Reaktif boyama, kompaktör", where: "Tekirdağ (Çorlu), Türkiye", who: "Örnek Boya Terbiye Ltd." },
      { stage: "Konfeksiyon", what: "Kesim, dikim, ütü-paket", where: "İstanbul, Türkiye", who: "Örnek Konfeksiyon A.Ş." }
    ],
    sustain: {
      co2: 5.2, co2unit: "kg CO₂e / adet",
      water: 1650, recycled: 30,
      breakdown: [
        ["Hammadde", 1.2], ["İplik", 1.1], ["Örme", 0.6], ["Boya & apre", 1.6], ["Konfeksiyon", 0.4], ["Nakliye", 0.3]
      ],
      certs: ["OCS (organik içerik)", "GRS (geri dön. pamuk)", "OEKO-TEX® Standard 100"],
      eol: "Tek tip lif (%100 pamuk) olduğu için geri dönüşüme çok uygundur. Kullanılmış tekstil toplama noktalarına bırakılabilir.",
      durability: "Boncuklanma (pilling) dayanımı: 4 (ISO 12945-2). Yıkamada boyut değişimi ≤ %4.",
      packaging: "Tekli poşet: %100 geri dönüştürülmüş LDPE."
    }
  }
};



/* ---------- Bakım sembolleri (ISO 3758 tarzı, basitleştirilmiş) ---------- */
const S = 'fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"';
const tub = `<path ${S} d="M4 11 L8.5 30 H31.5 L36 11"/><path ${S} d="M4 11 q4 -4 8 0 t8 0 t8 0 t8 0"/>`;
const X = (a,b,c,d)=>`<path ${S} d="M${a} ${b} L${c} ${d} M${c} ${b} L${a} ${d}"/>`;
const dots = (n,cx,cy,gap=5)=>Array.from({length:n},(_,i)=>`<circle cx="${cx+(i-(n-1)/2)*gap}" cy="${cy}" r="1.8" fill="currentColor"/>`).join('');
const ironPath = `<path ${S} d="M4 30 H36 V27 C36 19 31 14 23 14 H11 C8 18 5.5 24 4 30 Z"/>`;
const ICONS = {
  wash30: `<svg viewBox="0 0 40 40">${tub}<text x="20" y="25.5" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor" font-family="Plus Jakarta Sans,sans-serif">30</text></svg>`,
  wash30gentle: `<svg viewBox="0 0 40 40">${tub}<text x="20" y="25.5" text-anchor="middle" font-size="10" font-weight="700" fill="currentColor" font-family="Plus Jakarta Sans,sans-serif">30</text><path ${S} d="M8 35 H32"/></svg>`,
  noBleach: `<svg viewBox="0 0 40 40"><path ${S} d="M20 5 L36 33 H4 Z"/>${X(9,11,31,33)}</svg>`,
  tumble1: `<svg viewBox="0 0 40 40"><rect ${S} x="5" y="5" width="30" height="30" rx="2"/><circle ${S} cx="20" cy="20" r="11"/>${dots(1,20,20)}</svg>`,
  iron0: `<svg viewBox="0 0 40 40">${ironPath}${X(8,8,32,34)}</svg>`,
  iron2: `<svg viewBox="0 0 40 40">${ironPath}${dots(2,21,23)}</svg>`,
  noDryClean: `<svg viewBox="0 0 40 40"><circle ${S} cx="20" cy="20" r="13"/>${X(9,9,31,31)}</svg>`,
  dryCleanP: `<svg viewBox="0 0 40 40"><circle ${S} cx="20" cy="20" r="13"/><text x="20" y="25" text-anchor="middle" font-size="14" font-weight="700" fill="currentColor" font-family="Plus Jakarta Sans,sans-serif">P</text></svg>`
};

/* ---------- Ürün görselleri ---------- */
function art(p){
  const c = p.color.hex;
  if (p.type === "sock") return `<svg viewBox="0 0 80 80"><path d="M30 6 H50 V40 C50 44 52 47 56 50 L66 57 C72 61 72 70 66 73 C62 76 57 75 53 72 L33 58 C29 55 30 52 30 48 Z" fill="${c}" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/><path d="M30 14 H50" stroke="#ffffff" stroke-width="2"/><path d="M30 10 H50" stroke="#ffffff" stroke-width="1" opacity=".5"/></svg>`;
  return `<svg viewBox="0 0 80 80"><path d="M28 10 C31 15 49 15 52 10 L68 18 L62 32 L56 29 V70 H24 V29 L18 32 L12 18 Z" fill="${c}" stroke="#ffffff" stroke-width="2" stroke-linejoin="round"/><path d="M33 12 C35 17 45 17 47 12" fill="none" stroke="#fff" stroke-width="1.5" opacity=".6"/></svg>`;
}

function splitName(n){ const w = n.split(' '); const k = Math.max(1, Math.ceil(w.length/2)); return [w.slice(0,k).join(' '), w.slice(k).join(' ')]; }
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const fmt = (n, d) => n.toLocaleString('tr-TR', { minimumFractionDigits: d, maximumFractionDigits: d });

function render(){
  const ids = Object.keys(PRODUCTS);
  const key = (location.hash || '').slice(1);
  const id = PRODUCTS[key] ? key : ids[0];
  const p = PRODUCTS[id];
  const s = p.sustain;
  const maxB = Math.max(...s.breakdown.map(b => b[1]));
  const dec = s.co2 < 1 ? 2 : 1;

  document.title = p.name + ' – Dijital Ürün Pasaportu';
  document.getElementById('app').innerHTML = `
    <header class="top">
      <span class="brandmark">${esc(p.brand.split(' · ')[0])}</span>
      <span>Sürüm ${esc(p.passport.version)} · ${esc(p.passport.updated)}</span>
    </header>

    <div class="hero">
      <span class="pill">Dijital Ürün Pasaportu <span class="sep"></span> ${esc(p.passport.id)}</span>
      ${p.photo ? `<div class="art photo"><img src="${p.photo}" alt="${esc(p.name)}"></div>` : `<div class="art">${art(p)}</div>`}
      <h1>${esc(splitName(p.name)[0])}<b>${esc(splitName(p.name)[1])}</b></h1>
      <div class="group">${esc(p.group)}</div>
      <p class="lead">${esc(p.description)}</p>
      <div class="ctas">
        <button class="btn" data-go="malzeme">Bileşimi incele</button>
        <button class="btn primary" data-go="surdur">Sürdürülebilirlik <span aria-hidden="true">→</span></button>
      </div>
    </div>

    <div class="facts">
      <div class="fact"><div class="k">Beden</div><div class="v">${esc(p.size)}</div></div>
      <div class="fact"><div class="k">Cinsiyet</div><div class="v">${esc(p.gender)}</div></div>
      <div class="fact"><div class="k">Renk</div><div class="v"><span class="swatch" style="background:${p.color.hex}"></span>${esc(p.color.name)}</div></div>
      <div class="fact"><div class="k">Karbon ayak izi</div><div class="v">${fmt(s.co2,dec)} kg CO₂e</div></div>
    </div>

    <nav class="tabs" id="tabs">
      <button data-t="urun">Ürün</button>
      <button data-t="malzeme">Malzeme</button>
      <button data-t="bakim">Bakım</button>
      <button data-t="tedarik">Tedarik zinciri</button>
      <button data-t="surdur">Sürdürülebilirlik</button>
    </nav>

    <section id="urun">
      <h2><span class="n">01</span>Ürün bilgisi</h2>
      <dl class="rows">
        <div><dt>Ürün grubu</dt><dd>${esc(p.group)}</dd></div>
        <div><dt>Model / artikel no</dt><dd>${esc(p.article)}</dd></div>
        <div><dt>Beden</dt><dd>${esc(p.size)}</dd></div>
        <div><dt>Cinsiyet</dt><dd>${esc(p.gender)}</dd></div>
        <div><dt>Renk</dt><dd>${esc(p.color.name)}</dd></div>
        <div><dt>Sezon</dt><dd>${esc(p.season)}</dd></div>
      </dl>
    </section>

    <section id="malzeme">
      <h2><span class="n">02</span>Malzeme ve bileşim</h2>
      <div class="compbar">${p.composition.map(m => `<span style="width:${m.pct}%;background:${m.color}"></span>`).join('')}</div>
      <div class="legend">
        ${p.composition.map(m => `<div class="item"><span class="dot" style="background:${m.color}"></span><div><div><b>${esc(m.name)}</b></div><div class="sub">${esc(m.sub)}</div></div><span class="pct">%${m.pct}</span></div>`).join('')}
      </div>
      <h3>Materyal bilgisi</h3>
      <dl class="rows">${p.materialInfo.map(r => `<div><dt>${esc(r[0])}</dt><dd>${esc(r[1])}</dd></div>`).join('')}</dl>
    </section>

    <section id="bakim">
      <h2><span class="n">03</span>Etiket ve bakım talimatı</h2>
      <div class="care">${p.care.map(c => `<div class="c">${ICONS[c.icon] || ''}${esc(c.text)}</div>`).join('')}</div>
      <div class="tip">${esc(p.careTip)}</div>
    </section>

    <section id="tedarik">
      <h2><span class="n">04</span>Tedarik zinciri</h2>
      <ol class="chain">
        ${p.supply.map((st, i) => `<li><span class="pin">${i + 1}</span><div class="st">${esc(st.stage)}</div><div class="wh">${esc(st.what)} · <b>${esc(st.where)}</b></div><div class="who">${esc(st.who)}</div></li>`).join('')}
      </ol>
    </section>

    <section id="surdur">
      <h2><span class="n">05</span>Sürdürülebilirlik</h2>
      <div class="kpis">
        <div class="kpi"><div class="big">${fmt(s.co2,dec)}</div><div class="u">${esc(s.co2unit)}</div></div>
        <div class="kpi"><div class="big">${fmt(s.water,0)}</div><div class="u">L su kullanımı</div></div>
        <div class="kpi"><div class="big">%${s.recycled}</div><div class="u">geri dön. içerik</div></div>
      </div>
      <h3>CO₂ ayak izinin aşamalara dağılımı</h3>
      <div class="bars">
        ${s.breakdown.map(b => `<div class="bar"><span>${esc(b[0])}</span><span class="track"><span class="fill" style="display:block;width:${(b[1] / maxB * 100).toFixed(1)}%"></span></span><span class="val">${fmt(b[1],2)}</span></div>`).join('')}
      </div>
      <p class="note">Değerler kg CO₂e cinsinden, beşikten fabrika çıkışına + nakliye kapsamında tahmini değerlerdir.</p>
      <h3>Sertifikalar</h3>
      <div class="certs">${s.certs.map(c => `<span class="cert">${esc(c)}</span>`).join('')}</div>
      <dl class="rows stack">
        <div><dt>Dayanıklılık</dt><dd>${esc(s.durability)}</dd></div>
        <div><dt>Ambalaj</dt><dd>${esc(s.packaging)}</dd></div>
        <div><dt>Kullanım sonu</dt><dd>${esc(s.eol)}</dd></div>
      </dl>
    </section>

    <section>
      <h2><span class="n">06</span>Pasaport bilgileri</h2>
      <dl class="rows">
        <div><dt>Pasaport no</dt><dd>${esc(p.passport.id)}</dd></div>
        <div><dt>GTIN / barkod</dt><dd>${esc(p.passport.gtin)}</dd></div>
        <div><dt>Parti / lot</dt><dd>${esc(p.passport.lot)}</dd></div>
        <div><dt>Üretim tarihi</dt><dd>${esc(p.passport.produced)}</dd></div>
        <div><dt>Üretici</dt><dd>${esc(p.passport.manufacturer)}</dd></div>
      </dl>
      <div class="demo">Bu sayfa bir prototiptir. Firma adları, sertifikalar ve sayısal değerler temsilidir.</div>
    </section>

    <footer>
      <div class="qr" id="qrbox"><div id="qrcode" style="display:inline-block;padding:8px;background:#fff"></div><div>Bu ürünün QR kodu</div></div>
      <div class="other">Diğer örnek ürünler: ${ids.filter(k => k !== id).map(k => `<a href="#${k}">${esc(PRODUCTS[k].name)}</a>`).join(' · ')}</div>
    </footer>
  `;

  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => document.getElementById(b.dataset.go).scrollIntoView({ behavior: 'smooth', block: 'start' })));
  const tabs = document.getElementById('tabs');
  tabs.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    document.getElementById(b.dataset.t).scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  const secs = ['urun','malzeme','bakim','tedarik','surdur'].map(x => document.getElementById(x));
  const mark = () => {
    let cur = secs[0].id;
    for (const s of secs) if (s.getBoundingClientRect().top < 120) cur = s.id;
    tabs.querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.t === cur));
  };
  window.onscroll = mark; mark();


  // ---- Kaydırınca netleşme ----
  const groups = ['.hero > *', '.facts', 'main-sections', 'dl.rows > div', '.legend .item', '.care .c', 'ol.chain li', '.kpi', '.bar', '.cert', '.tip', '.compbar', 'footer > *'];
  const targets = [];
  groups.forEach(sel => {
    const els = sel === 'main-sections' ? document.querySelectorAll('#app > section') : document.querySelectorAll('#app ' + sel);
    els.forEach(el => {
      const sibs = [...el.parentElement.children].filter(c => c.matches(sel === 'main-sections' ? 'section' : sel.split(' ').pop()));
      const i = Math.max(0, sibs.indexOf(el));
      el.classList.add('reveal');
      el.style.setProperty('--d', Math.min(i * 70, 420) + 'ms');
      targets.push(el);
    });
  });
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(entries => {
      entries.forEach(en => { if (en.isIntersecting) { en.target.classList.add('in'); io.unobserve(en.target); } });
    }, { threshold: 0.12, rootMargin: '0px 0px -2% 0px' });
    targets.forEach(el => io.observe(el));
  } else {
    targets.forEach(el => el.classList.add('in'));
  }

  // QR kodu, sayfa nerede yayınlanıyorsa o adrese göre üretilir
  const url = location.href.split('#')[0] + '#' + id;
  const box = document.getElementById('qrcode');
  if (window.QRCode && box) {
    new QRCode(box, { text: url, width: 160, height: 160, correctLevel: QRCode.CorrectLevel.M });
  } else {
    document.getElementById('qrbox').style.display = 'none';
  }
  window.scrollTo(0, 0);
}

window.addEventListener('hashchange', render);
render();
</script>
</body>
</html>
